[pytest]
# The suite's tiers. `scripts/test.sh` runs `-m "not slow"` in the inner loop and everything at
# the merge gate; `scripts/test.sh --full` is that gate.
markers =
    slow: a full-corpus regeneration or parity pass (minutes); excluded from the inner loop
    xdist_group: pytest-xdist's grouping marker, used to pin the coverage record to one worker
