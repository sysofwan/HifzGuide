<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tadabur poison audit — B/C labelling (#6)</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#252a34; --fg:#e6e9ef; --muted:#9aa4b2;
          --accept:#1f9d55; --reject:#d64541; --mark:#f6c744; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-columns:300px 1fr; grid-template-rows:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:16px; }
  main { overflow-y:auto; padding:24px 28px; }
  h1 { font-size:15px; margin:0 0 4px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 8px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .contrast-row { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .contrast-row:hover { background:#1e222b; }
  .contrast-row.active { background:#242a36; }
  .contrast-row.done .name::after { content:" ✓"; color:var(--accept); }
  .toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:6px 0 4px; cursor:pointer; }
  .toggle input { width:16px; height:16px; cursor:pointer; }
  .name { flex:1; font-variant-numeric:tabular-nums; }
  .arabic { font-size:17px; }
  .pill { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .poison { font-weight:600; }
  .poison.hot { color:var(--reject); }
  .bar { height:4px; background:#2a2f3a; border-radius:2px; margin-top:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 22px; max-width:760px; }
  .card.accepted { border-color:var(--accept); }
  .card.rejected { border-color:var(--reject); }
  .head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:4px; }
  .head .big { font-size:24px; }
  .head .ref { font-size:18px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .tag { font-size:12px; padding:2px 8px; border-radius:20px; background:#242a36; color:var(--muted); }
  .tag.marginal { color:var(--mark); }
  audio { width:100%; margin:16px 0; }
  .btns { display:flex; gap:10px; margin:6px 0 14px; }
  button { font:inherit; border:1px solid var(--line); background:#20252f; color:var(--fg);
           padding:10px 16px; border-radius:8px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.accept { background:rgba(31,157,85,.16); border-color:var(--accept); }
  button.reject { background:rgba(214,69,65,.16); border-color:var(--reject); }
  button.on-accept { background:var(--accept); color:#fff; }
  button.on-reject { background:var(--reject); color:#fff; }
  button.ghost { background:transparent; }
  textarea { width:100%; min-height:52px; background:#12151b; color:var(--fg); border:1px solid var(--line);
             border-radius:8px; padding:8px 10px; font:inherit; resize:vertical; }
  .warn { color:var(--reject); font-size:12px; margin:8px 0; }
  .ayah { font-size:30px; line-height:1.9; text-align:right; direction:rtl; margin:6px 0 14px;
          padding:12px 14px; background:#12151b; border:1px solid var(--line); border-radius:8px; }
  .phon { margin:12px 0; }
  .phon h4 { margin:0 0 6px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
             letter-spacing:.04em; }
  .align { direction:rtl; text-align:right; background:#12151b; border:1px solid var(--line);
           border-radius:8px; padding:10px 12px; font-size:22px; line-height:1.7;
           overflow-x:auto; white-space:nowrap; }
  .align .col { display:inline-flex; flex-direction:column; align-items:center; margin:0 1px;
                vertical-align:top; border-radius:5px; padding:2px 3px; }
  .align .col .r { color:var(--fg); }
  .align .col .p { font-size:15px; color:var(--muted); }
  .align .col.sub { background:rgba(214,69,65,.20); }
  .align .col.sub .p { color:var(--reject); }
  .align .col.del { background:rgba(214,69,65,.12); }
  .align .col.del .p { color:var(--reject); }
  .align .col.ins { background:rgba(224,168,0,.15); }
  .align .col.ins .r { color:var(--mark); }
  .align .col.ins .p { color:var(--mark); }
  .align .col.match .p { color:#3f7d55; }
  .plainphon { direction:rtl; text-align:right; font-size:16px; color:var(--muted); line-height:1.8;
               margin:4px 0; word-break:break-word; }
  .phonlegend { color:var(--muted); font-size:11px; margin-top:4px; }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:16px; color:var(--muted); }
  kbd { font:11px monospace; background:#242a36; border:1px solid var(--line); border-bottom-width:2px;
        border-radius:4px; padding:1px 5px; }
  .legend { color:var(--muted); font-size:12px; margin-top:18px; line-height:1.9; }
  .empty { color:var(--muted); padding:40px 0; }

  /* Mobile top bar + drawer scrim: hidden on desktop, shown under the media query. */
  .topbar { display:none; align-items:center; gap:12px; padding:10px 14px; background:var(--panel);
            border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .topbar .menu { padding:8px 12px; font-size:18px; line-height:1; }
  .topbar .title { font-size:14px; font-weight:600; }
  .topbar .prog { margin-left:auto; color:var(--muted); font-size:12px; }
  .scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; }

  @media (max-width:720px) {
    body { display:block; height:auto; min-height:100vh; }
    .topbar { display:flex; }
    aside { position:fixed; top:0; left:0; bottom:0; width:84%; max-width:320px; height:100vh;
            transform:translateX(-100%); transition:transform .2s ease; z-index:40; }
    body.drawer-open aside { transform:none; }
    body.drawer-open .scrim { display:block; }
    main { overflow:visible; padding:14px; }
    .card { padding:16px 14px; max-width:none; }
    .head .big { font-size:20px; }
    .head .ref { font-size:16px; }
    .ayah { font-size:24px; padding:10px 12px; }
    .align { font-size:20px; }
    .legend { display:none; }
    .btns { position:sticky; bottom:0; gap:8px; margin:10px 0 6px; padding:10px 0;
            background:linear-gradient(to top, var(--bg) 78%, transparent); z-index:5; }
    .btns button { flex:1; min-height:48px; padding:10px 8px; }
    .btns .ghost { flex:0 0 auto; }
    .nav button { min-height:44px; padding:10px 18px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <button class="menu" onclick="toggleDrawer()" aria-label="Toggle contrast menu">☰</button>
  <span class="title">Poison audit — #6</span>
  <span id="topprog" class="prog"></span>
</header>
<div class="scrim" onclick="toggleDrawer(false)"></div>
<aside>
  <h1>Poison audit — #6</h1>
  <div class="sub">B = accept (gold) · C = reject (poison)</div>
  <div id="overall" class="sub"></div>
  <label class="toggle"><input type="checkbox" id="hidelabeled" onchange="setHideLabeled(this.checked)"> Hide labeled</label>
  <h2>Contrasts</h2>
  <div id="contrasts"></div>
  <a id="wholeclip-link" href="/whole-clip" style="display:none; margin-top:16px;
     color:var(--accent); font-size:12px; text-decoration:none;">→ Whole-clip data path (#26)</a>
  <div class="legend">
    <div><kbd>A</kbd> accept · <kbd>R</kbd> reject</div>
    <div><kbd>U</kbd> unmark · <kbd>←</kbd>/<kbd>→</kbd> prev/next</div>
    <div><kbd>Space</kbd> replay audio</div>
  </div>
</aside>
<main>
  <div id="card-wrap"></div>
</main>

<script>
const state = { items: [], stats: [], order: [], filter: null, idx: 0,
  hideLabeled: JSON.parse(localStorage.getItem("hideLabeled") || "false") };

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

function visibleItems() {
  let items = state.filter ? state.items.filter(i => i.contrast === state.filter) : state.items;
  if (state.hideLabeled) items = items.filter(i => !i.verdict);
  return items;
}

function setHideLabeled(on) {
  state.hideLabeled = on;
  localStorage.setItem("hideLabeled", JSON.stringify(on));
  state.idx = 0;
  render();
}

function fmtRatio(r) { return r == null ? "—" : r.toFixed(3); }

function toggleDrawer(force) {
  const open = force === undefined ? !document.body.classList.contains("drawer-open") : force;
  document.body.classList.toggle("drawer-open", open);
}

function renderSidebar() {
  const done = state.items.filter(i => i.verdict).length;
  const summary = `${done} / ${state.items.length} rows labelled`;
  document.getElementById("overall").textContent = summary;
  document.getElementById("topprog").textContent = `${done}/${state.items.length}`;
  const hl = document.getElementById("hidelabeled");
  if (hl) hl.checked = state.hideLabeled;

  const box = document.getElementById("contrasts");
  box.innerHTML = "";
  const byContrast = Object.fromEntries(state.stats.map(s => [s.contrast, s]));
  const all = { contrast: "(all)", total: state.items.length, labelled: done, poison_rate: null };
  [all, ...state.order.map(c => byContrast[c]).filter(Boolean)].forEach(s => {
    const isAll = s.contrast === "(all)";
    const entry = document.createElement("div");
    const row = document.createElement("div");
    row.className = "contrast-row" +
      (((isAll && !state.filter) || state.filter === s.contrast) ? " active" : "") +
      (!isAll && s.total && s.labelled === s.total ? " done" : "");
    const pr = s.poison_rate;
    row.innerHTML = `
      <span class="name arabic">${s.contrast}</span>
      <span class="pill">${s.labelled}/${s.total}${
        pr != null ? ` · <span class="poison ${pr > 0.15 ? "hot" : ""}">${(pr*100).toFixed(0)}%C</span>` : ""
      }</span>`;
    const barPct = s.total ? (s.labelled / s.total * 100) : 0;
    const bar = document.createElement("div"); bar.className = "bar";
    bar.innerHTML = `<i style="width:${barPct}%"></i>`;
    entry.appendChild(row);
    entry.appendChild(bar);
    entry.style.marginBottom = "4px";
    entry.onclick = () => { state.filter = isAll ? null : s.contrast; state.idx = 0; toggleDrawer(false); render(); };
    box.appendChild(entry);
  });
}

function renderCard() {
  const wrap = document.getElementById("card-wrap");
  const items = visibleItems();
  if (!items.length) {
    const msg = state.hideLabeled ? "All rows in this bucket are labeled. 🎉"
      : "No rows in this bucket.";
    wrap.innerHTML = `<div class="empty">${msg}</div>`; return;
  }
  if (state.idx >= items.length) state.idx = items.length - 1;
  const it = items[state.idx];

  const cls = it.verdict === "accept" ? "accepted" : it.verdict === "reject" ? "rejected" : "";
  wrap.innerHTML = `
    <div class="card ${cls}">
      <div class="head">
        <span class="big arabic">${it.contrast}</span>
        <span class="ref">${it.surah_ayah || "?:?"}</span>
        <span class="tag ${it.contrast === "marginal" ? "marginal" : ""}">match ${fmtRatio(it.match_ratio)}</span>
        <span class="tag">row ${state.idx + 1} / ${items.length}</span>
      </div>
      <div class="sub">${it.clip_id}</div>
      ${it.uthmani ? `<div class="ayah arabic">${esc(it.uthmani)}</div>` : ""}
      ${it.audio_available
        ? `<audio id="au" controls autoplay src="${it.audio_url}"></audio>`
        : `<div class="warn">⚠ audio not exported for this clip — re-run the sampler with --audio-dir.</div>`}
      ${renderPhonemes(it)}
      <div class="btns">
        <button class="accept ${it.verdict==="accept"?"on-accept":""}" onclick="label('accept')">B · Accept (gold)</button>
        <button class="reject ${it.verdict==="reject"?"on-reject":""}" onclick="label('reject')">C · Reject (poison)</button>
        <button class="ghost" onclick="label(null)">Unmark</button>
      </div>
      <textarea id="note" placeholder="Optional note (why B/C, what you heard)…">${it.note || ""}</textarea>
      <div class="nav">
        <button class="ghost" onclick="go(-1)">← Prev</button>
        <span>${it.verdict ? it.verdict.toUpperCase() : "unlabelled"}</span>
        <button class="ghost" onclick="go(1)">Next →</button>
      </div>
    </div>`;
}

function render() { renderSidebar(); renderCard(); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function renderPhonemes(it) {
  const hasPred = it.predicted_phonemes && it.predicted_phonemes.trim();
  if (!hasPred && !it.reference_phonemes && !it.raw_reference_phonemes) return "";
  let diff = "";
  if (it.alignment && it.alignment.length) {
    const cols = it.alignment.map(c =>
      `<span class="col ${c.kind}"><span class="r arabic">${esc(c.ref || "·")}</span>` +
      `<span class="p arabic">${esc(c.pred || "·")}</span></span>`).join("");
    diff = `<div class="align">${cols}</div>
      <div class="phonlegend">top = reference (expected) · bottom = model output ·
        <b style="color:var(--reject)">red</b> = substitution/drop ·
        <b style="color:var(--mark)">amber</b> = inserted · · = gap</div>`;
  }
  const pred = hasPred
    ? `<div class="plainphon arabic"><b>heard:</b> ${esc(it.predicted_phonemes)}</div>` : "";
  const refText = it.raw_reference_phonemes || it.reference_phonemes;
  const ref = refText
    ? `<div class="plainphon arabic"><b>reference:</b> ${esc(refText)}</div>` : "";
  return `<div class="phon"><h4>Phoneme output</h4>${diff}${ref}${pred}</div>`;
}

function go(delta) {
  const n = visibleItems().length;
  if (!n) return;
  state.idx = Math.min(Math.max(state.idx + delta, 0), n - 1);
  render();
}

async function label(verdict) {
  const items = visibleItems();
  if (!items.length) return;
  const it = items[state.idx];
  const note = document.getElementById("note") ? document.getElementById("note").value : "";
  const res = await api("/api/label", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ clip_id: it.clip_id, contrast: it.contrast, verdict, note }),
  });
  if (res.error) { alert(res.error); return; }
  it.verdict = verdict; it.note = verdict ? note : "";
  state.stats = res.stats;
  if (verdict && state.hideLabeled) {
    // The just-labeled row drops out of the list, so the same index now
    // points at the next unlabeled row — re-render in place, don't advance.
    render();
  } else if (verdict) { renderSidebar(); go(1); } else { render(); }
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (k === "a") { label("accept"); e.preventDefault(); }
  else if (k === "r") { label("reject"); e.preventDefault(); }
  else if (k === "u") { label(null); e.preventDefault(); }
  else if (e.key === "ArrowRight") { go(1); }
  else if (e.key === "ArrowLeft") { go(-1); }
  else if (e.key === " ") { const a = document.getElementById("au"); if (a) { a.currentTime = 0; a.play(); e.preventDefault(); } }
});

(async function init() {
  const s = await api("/api/state");
  state.items = s.items; state.stats = s.stats; state.order = s.contrast_order;
  if (s.whole_clip_available) {
    document.getElementById("wholeclip-link").style.display = "block";
  }
  render();
})();
</script>
</body>
</html>
