<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listening session</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #d6d4cc;
    --card: #ffffff; --accent: #1f6f4a; --accent-fg: #ffffff; --mark: #ffd34d;
    --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3934;
      --card: #201f1c; --accent: #3fae7c; --accent-fg: #0d1a13; --mark: #8a6d00;
      --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.45 system-ui, -apple-system, sans-serif;
         -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg);
           border-bottom: 1px solid var(--line);
           padding: calc(.5rem + env(safe-area-inset-top)) 16px .5rem;
           display: flex; align-items: center; gap: .75rem; }
  #count { font-weight: 600; flex: 1; min-width: 0; }
  main { max-width: 40rem; margin: 0 auto; padding: 12px 16px 32px; }
  .prompt { font-size: 1.05rem; font-weight: 600; margin: .25rem 0 .5rem; }
  .meta { color: var(--muted); font-size: .85rem; }
  .reference { direction: rtl; text-align: right; font-family: "Amiri", "Geeza Pro",
               "Noto Naskh Arabic", serif; font-size: 2rem; line-height: 2.1;
               overflow-wrap: anywhere; background: var(--card);
               border: 1px solid var(--line); border-radius: 12px;
               padding: .4rem .9rem; margin: .5rem 0 .75rem; }
  .reference mark { background: var(--mark); color: inherit; border-radius: 4px; }
  .controls, .choices { display: grid; gap: 10px; }
  .controls { grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr));
              margin-bottom: 14px; }
  .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  button { font: inherit; color: inherit; background: var(--card); min-height: 56px;
           min-width: 0; overflow-wrap: anywhere;
           border: 1px solid var(--line); border-radius: 12px; padding: .5rem;
           cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: var(--accent-fg);
                   border-color: var(--accent); font-weight: 600; }
  button.choice { font-size: 1.1rem; font-weight: 600; }
  button.choice .ar { font-family: "Amiri", "Geeza Pro", serif; font-size: 1.6rem;
                      display: block; line-height: 1.2; }
  button.choice.letter .ar { font-size: 2.2rem; }
  button.chosen { outline: 3px solid var(--accent); outline-offset: -3px; }
  button.unclear { grid-column: 1 / -1; min-height: 48px; font-weight: 400; }
  .prompt.second { margin-top: 18px; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row button { flex: 1; min-height: 48px; }
  input[type=text] { font: inherit; color: inherit; background: var(--card); width: 100%;
                     min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
                     padding: .5rem .7rem; margin-top: 14px; }
  #error { display: none; background: var(--warn); color: #fff; border-radius: 10px;
           padding: .6rem .8rem; margin-bottom: 10px; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 16px; }
  kbd { font: .75em ui-monospace, monospace; opacity: .7; }
  @media (hover: none) { kbd, .hint { display: none; } }
  #jump { min-height: 40px; padding: .3rem .8rem; flex: none; }
  body.saving .choices button { opacity: .5; }
</style>
</head>
<body>
<header>
  <span id="count">Loading…</span>
  <button id="jump">Next unanswered <kbd>u</kbd></button>
</header>
<main>
  <div id="error"></div>
  <div class="prompt" id="prompt"></div>
  <div class="meta" id="meta"></div>
  <div class="reference" id="reference" dir="rtl"></div>
  <div class="controls">
    <button class="primary" id="play">Play <kbd>space</kbd></button>
    <button id="slow">Slower <kbd>s</kbd></button>
    <button id="whole">Whole <kbd>w</kbd></button>
  </div>
  <div class="choices" id="choices"></div>
  <div id="natural-block" hidden>
    <div class="prompt second">Does this recitation sound natural?</div>
    <div class="choices" id="natural-choices"></div>
  </div>
  <input type="text" id="note" placeholder="Note (optional)" autocomplete="off">
  <div class="row">
    <button id="prev">&larr; Prev</button>
    <button id="next">Next &rarr;</button>
  </div>
  <p class="hint">Keys: <kbd>1</kbd>–<kbd>6</kbd> answer in order shown, <kbd>space</kbd>
    play, <kbd>s</kbd> slower, <kbd>w</kbd> whole segment, <kbd>&larr;</kbd>/<kbd>&rarr;</kbd>
    move, <kbd>u</kbd> next unanswered. Answering moves on and plays the next site.</p>
  <audio id="player" preload="auto"></audio>
</main>

<script type="module">
// Answer what you hear, not what is written. Nothing on this page says what the mushaf
// prescribes, what any model heard, or how any answer would score. The logic is in
// /session.mjs; this script only wires it to the document.
import { createSession } from "/session.mjs";

const PROMPTS = {
  tashkeel: "Which mark do you hear on the highlighted letter?",
  shaddah: "Is the highlighted consonant held (doubled)?",
  consonant: "Which letter do you hear at the highlighted place?",
};
const LABELS = {
  fatha: ["Fatha", "\u0640\u064E"], damma: ["Damma", "\u0640\u064F"],
  kasra: ["Kasra", "\u0640\u0650"], sukun: ["Sukun", "\u0640\u0652"],
  held: ["Held", ""], not_held: ["Not held", ""], unclear: ["Unclear", ""],
  natural: ["Natural", ""], unnatural: ["Unnatural", ""],
};
const SLOW_RATE = 0.6;
const $ = (id) => document.getElementById(id);
const audio = $("player");
let shown = null;
// Every answer button on screen, in display order ({field, value}): what keys 1-6 press.
let buttons = [];

const player = {
  stop() {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
  },
  play(key, { slow = false, whole = false } = {}) {
    audio.src = `/api/audio?key=${key}&whole=${whole ? 1 : 0}`;
    audio.defaultPlaybackRate = audio.playbackRate = slow ? SLOW_RATE : 1;
    audio.preservesPitch = true;
    audio.play().catch(() => {});
  },
};

const view = {
  render(site, { position, total, answered }) {
    shown = site;
    $("count").textContent = `${answered} of ${total} answered`;
    $("prompt").textContent = PROMPTS[site.mode];
    $("meta").textContent = `Site ${position} · ayah ${site.surah_ayah}`;
    const ref = $("reference");
    ref.textContent = "";
    const mark = document.createElement("mark");
    mark.textContent = site.carrier;
    ref.append(site.before, mark, site.after);
    $("note").value = site.note || "";
    renderChoices(site);
  },
  saving(on) { document.body.classList.toggle("saving", on); },
  drafted(draft) {
    for (const button of document.querySelectorAll("button.choice")) {
      const { field, value } = button.dataset;
      if (field in draft) button.classList.toggle("chosen", draft[field] === value);
    }
  },
  error(message) {
    $("error").textContent = message;
    $("error").style.display = message ? "block" : "none";
  },
};

const api = {
  async sites() {
    const response = await fetch("/api/sites");
    return (await response.json()).sites;
  },
  async save(body) {
    const response = await fetch("/api/verdict", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || `HTTP ${response.status}`);
    }
  },
};

const session = createSession({ api, player, view });

// `field` is "heard" (what was said) or "natural" (whether it sounds natural).
function choose({ field, value }) {
  const note = $("note").value;
  return field === "natural" ? session.judge(value, note) : session.answer(value, note);
}

function renderChoices(site) {
  buttons = [];
  $("choices").classList.toggle("four", site.mode === "tashkeel");
  fillChoices($("choices"), "heard", site.choices, site.heard, site.mode === "consonant");
  const asksNatural = "natural" in site;
  $("natural-block").hidden = !asksNatural;
  $("natural-choices").innerHTML = "";
  if (asksNatural) {
    fillChoices($("natural-choices"), "natural", site.natural_choices, site.natural, false);
  }
}

function fillChoices(box, field, values, chosen, letters) {
  box.innerHTML = "";
  for (const value of values) {
    const button = document.createElement("button");
    const [label, arabic] = LABELS[value] || ["", value];
    button.className = "choice" + (value === "unclear" ? " unclear" : "")
      + (letters && value !== "unclear" ? " letter" : "");
    button.classList.toggle("chosen", chosen === value);
    button.dataset.field = field;
    button.dataset.value = value;
    if (arabic) {
      const ar = document.createElement("span");
      ar.className = "ar"; ar.textContent = arabic;
      button.appendChild(ar);
    }
    button.appendChild(document.createTextNode(label + " "));
    buttons.push({ field, value });
    const kbd = document.createElement("kbd");
    kbd.textContent = String(buttons.length);
    button.appendChild(kbd);
    button.onclick = () => choose({ field, value });
    box.appendChild(button);
  }
}

$("play").onclick = () => session.play();
$("slow").onclick = () => session.play({ slow: true });
$("whole").onclick = () => session.play({ whole: true });
$("prev").onclick = () => session.move(-1);
$("next").onclick = () => session.move(1);
$("jump").onclick = () => {
  const { answered, total } = session.state();
  if (!session.jump() && answered === total) view.error("Every site is answered.");
};

document.addEventListener("keydown", (event) => {
  if (event.target === $("note") || event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.repeat) { event.preventDefault(); return; }  // a held key answers nothing
  const n = Number(event.key);
  if (shown && n >= 1 && n <= buttons.length) {
    event.preventDefault();
    choose(buttons[n - 1]);
    return;
  }
  const actions = {
    " ": () => session.play(), s: () => session.play({ slow: true }),
    w: () => session.play({ whole: true }), u: () => session.jump(),
    ArrowLeft: () => session.move(-1), ArrowRight: () => session.move(1),
  };
  if (actions[event.key]) { event.preventDefault(); actions[event.key](); }
});

session.load().catch((error) => view.error(`Could not load the sites (${error.message}).`));
</script>
</body>
</html>
