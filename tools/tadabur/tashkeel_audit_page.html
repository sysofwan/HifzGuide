<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listening session</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #d6d4cc;
    --card: #ffffff; --accent: #1f6f4a; --accent-fg: #ffffff; --mark: #ffd34d;
    --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3934;
      --card: #201f1c; --accent: #3fae7c; --accent-fg: #0d1a13; --mark: #8a6d00;
      --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.45 system-ui, -apple-system, sans-serif;
         -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg);
           border-bottom: 1px solid var(--line);
           padding: calc(.5rem + env(safe-area-inset-top)) 16px .5rem;
           display: flex; align-items: center; gap: .75rem; }
  #count { font-weight: 600; flex: 1; min-width: 0; }
  main { max-width: 40rem; margin: 0 auto; padding: 12px 16px 32px; }
  .prompt { font-size: 1.05rem; font-weight: 600; margin: .25rem 0 .5rem; }
  .meta { color: var(--muted); font-size: .85rem; }
  .reference { direction: rtl; text-align: right; font-family: "Amiri", "Geeza Pro",
               "Noto Naskh Arabic", serif; font-size: 2rem; line-height: 2.1;
               overflow-wrap: anywhere; background: var(--card);
               border: 1px solid var(--line); border-radius: 12px;
               padding: .4rem .9rem; margin: .5rem 0 .75rem; }
  .reference mark { background: var(--mark); color: inherit; border-radius: 4px; }
  .controls, .choices { display: grid; gap: 10px; }
  .controls { grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr));
              margin-bottom: 14px; }
  .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  button { font: inherit; color: inherit; background: var(--card); min-height: 56px;
           min-width: 0; overflow-wrap: anywhere;
           border: 1px solid var(--line); border-radius: 12px; padding: .5rem;
           cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: var(--accent-fg);
                   border-color: var(--accent); font-weight: 600; }
  button.choice { font-size: 1.1rem; font-weight: 600; }
  button.choice .ar { font-family: "Amiri", "Geeza Pro", serif; font-size: 1.6rem;
                      display: block; line-height: 1.2; }
  button.choice.letter .ar { font-size: 2.2rem; }
  button.chosen { outline: 3px solid var(--accent); outline-offset: -3px; }
  button.unclear { grid-column: 1 / -1; min-height: 48px; font-weight: 400; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row button { flex: 1; min-height: 48px; }
  input[type=text] { font: inherit; color: inherit; background: var(--card); width: 100%;
                     min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
                     padding: .5rem .7rem; margin-top: 14px; }
  #error { display: none; background: var(--warn); color: #fff; border-radius: 10px;
           padding: .6rem .8rem; margin-bottom: 10px; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 16px; }
  kbd { font: .75em ui-monospace, monospace; opacity: .7; }
  @media (hover: none) { kbd, .hint { display: none; } }
  #jump { min-height: 40px; padding: .3rem .8rem; flex: none; }
</style>
</head>
<body>
<header>
  <span id="count">Loading…</span>
  <button id="jump">Next unanswered <kbd>u</kbd></button>
</header>
<main>
  <div id="error"></div>
  <div class="prompt" id="prompt"></div>
  <div class="meta" id="meta"></div>
  <div class="reference" id="reference" dir="rtl"></div>
  <div class="controls">
    <button class="primary" id="play">Play <kbd>space</kbd></button>
    <button id="slow">Slower <kbd>s</kbd></button>
    <button id="whole">Whole <kbd>w</kbd></button>
  </div>
  <div class="choices" id="choices"></div>
  <input type="text" id="note" placeholder="Note (optional)" autocomplete="off">
  <div class="row">
    <button id="prev">&larr; Prev</button>
    <button id="next">Next &rarr;</button>
  </div>
  <p class="hint">Keys: <kbd>1</kbd>–<kbd>5</kbd> answer in order shown, <kbd>space</kbd>
    play, <kbd>s</kbd> slower, <kbd>w</kbd> whole segment, <kbd>&larr;</kbd>/<kbd>&rarr;</kbd>
    move, <kbd>u</kbd> next unanswered. Answering moves on and plays the next site.</p>
  <audio id="player" preload="auto"></audio>
</main>

<script>
// Answer what you hear, not what is written. Nothing on this page says what the mushaf
// prescribes, what any model heard, or how any answer would score.
const PROMPTS = {
  tashkeel: "Which mark do you hear on the highlighted letter?",
  shaddah: "Is the highlighted consonant held (doubled)?",
  consonant: "Which letter do you hear at the highlighted place?",
};
const LABELS = {
  fatha: ["Fatha", "ـَ"], damma: ["Damma", "ـُ"],
  kasra: ["Kasra", "ـِ"], sukun: ["Sukun", "ـْ"],
  held: ["Held", ""], not_held: ["Not held", ""], unclear: ["Unclear", ""],
};
const SLOW_RATE = 0.6;

let sites = [];
let index = 0;
const $ = (id) => document.getElementById(id);
const player = $("player");

function answered() { return sites.filter((s) => s.heard !== null).length; }
function firstUnanswered(from = 0) {
  for (let k = 0; k < sites.length; k++) {
    const i = (from + k) % sites.length;
    if (sites[i].heard === null) return i;
  }
  return -1;
}

function showError(message) {
  $("error").textContent = message;
  $("error").style.display = message ? "block" : "none";
}

function renderChoices(site) {
  const box = $("choices");
  box.innerHTML = "";
  box.classList.toggle("four", site.mode === "tashkeel");
  site.choices.forEach((choice, i) => {
    const button = document.createElement("button");
    const [label, arabic] = LABELS[choice] || ["", choice];
    button.className = "choice" + (choice === "unclear" ? " unclear" : "")
      + (site.mode === "consonant" && choice !== "unclear" ? " letter" : "");
    button.classList.toggle("chosen", site.heard === choice);
    if (arabic) {
      const ar = document.createElement("span");
      ar.className = "ar"; ar.textContent = arabic;
      button.appendChild(ar);
    }
    button.appendChild(document.createTextNode(label + " "));
    const kbd = document.createElement("kbd");
    kbd.textContent = String(i + 1);
    button.appendChild(kbd);
    button.onclick = () => answer(choice);
    box.appendChild(button);
  });
}

function render() {
  const site = sites[index];
  if (!site) return;
  $("count").textContent = `${answered()} of ${sites.length} answered`;
  $("prompt").textContent = PROMPTS[site.mode];
  $("meta").textContent = `Site ${index + 1} · ayah ${site.surah_ayah}`;
  const ref = $("reference");
  ref.textContent = "";
  ref.append(site.before);
  const mark = document.createElement("mark");
  mark.textContent = site.carrier;
  ref.append(mark, site.after);
  $("note").value = site.note || "";
  renderChoices(site);
}

// Playback is started synchronously inside the tap or key handler, so a phone treats it
// as user-initiated and lets it play.
function play({ slow = false, whole = false } = {}) {
  const site = sites[index];
  if (!site) return;
  const src = `/api/audio?key=${site.key}&whole=${whole ? 1 : 0}`;
  if (!player.src.endsWith(src)) player.src = src;
  player.currentTime = 0;
  player.defaultPlaybackRate = player.playbackRate = slow ? SLOW_RATE : 1;
  player.preservesPitch = true;
  player.play().catch(() => {});
}

function move(delta) {
  index = Math.min(sites.length - 1, Math.max(0, index + delta));
  render();
}

function answer(heard) {
  const site = sites[index];
  const previous = [site.heard, site.note];
  site.heard = heard;
  site.note = $("note").value;
  const body = JSON.stringify({ key: site.key, heard, note: site.note });
  const next = firstUnanswered(index + 1);
  if (next >= 0) { index = next; render(); play(); } else { render(); }
  fetch("/api/verdict", { method: "POST", headers: { "Content-Type": "application/json" },
                          body })
    .then(async (response) => {
      if (!response.ok) throw new Error((await response.json()).error || response.status);
      showError("");
    })
    .catch((error) => {
      [site.heard, site.note] = previous;
      render();
      showError(`Not saved (${error.message}). Go back and answer that site again.`);
    });
}

$("play").onclick = () => play();
$("slow").onclick = () => play({ slow: true });
$("whole").onclick = () => play({ whole: true });
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("jump").onclick = () => {
  const next = firstUnanswered(index);
  if (next < 0) { showError(""); $("count").textContent = "All answered"; return; }
  index = next; render(); play();
};

document.addEventListener("keydown", (event) => {
  if (event.target === $("note") || event.metaKey || event.ctrlKey) return;
  const site = sites[index];
  const n = Number(event.key);
  if (site && n >= 1 && n <= site.choices.length) {
    event.preventDefault(); answer(site.choices[n - 1]); return;
  }
  const actions = {
    " ": () => play(), s: () => play({ slow: true }), w: () => play({ whole: true }),
    u: () => $("jump").click(), ArrowLeft: () => move(-1), ArrowRight: () => move(1),
  };
  if (actions[event.key]) { event.preventDefault(); actions[event.key](); }
});

fetch("/api/sites").then((r) => r.json()).then((data) => {
  sites = data.sites;
  index = Math.max(0, firstUnanswered());
  render();
}).catch((error) => showError(`Could not load the sites (${error.message}).`));
</script>
</body>
</html>
